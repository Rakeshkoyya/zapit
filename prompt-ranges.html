<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split PDF — Zapit</title>
    <meta name="prompt-option" content="ranges" />
    <meta name="prompt-label" content="Pages to extract" />
    <meta name="prompt-placeholder" content="1-3" />
    <meta name="prompt-presets" content="1,1-3,2-" />
  </head>
  <body class="dialog">
    <div class="dialog__head">
      <div class="dialog__title">Split PDF</div>
      <div class="dialog__sub truncate" id="name"></div>
    </div>

    <div class="dialog__body">
      <div>
        <label class="prompt__label" id="label" for="value"></label>
        <input class="field prompt__input" id="value" type="text" />
        <span id="presets"></span>
      </div>
      <p class="banner">
        <span>
          <strong>1-3</strong> takes pages one to three, <strong>7</strong> takes a single page,
          <strong>9-</strong> takes page nine to the end. Separate groups with commas — each group
          becomes its own PDF.
        </span>
      </p>
      <p class="error" id="error"></p>
    </div>

    <div class="dialog__foot">
      <span class="spacer"></span>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn btn--primary" id="go" type="button">Split</button>
    </div>

    <script type="module" src="/src/windows/prompt/main.ts"></script>
  </body>
</html>
