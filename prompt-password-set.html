<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protect PDF — Zapit</title>
    <meta name="prompt-option" content="password" />
    <meta name="prompt-label" content="New password" />
    <meta name="prompt-placeholder" content="" />
    <meta name="prompt-presets" content="" />
    <meta name="prompt-type" content="password" />
    <meta name="prompt-confirm" content="true" />
  </head>
  <body class="dialog">
    <div class="dialog__head">
      <div class="dialog__title">Protect PDF</div>
      <div class="dialog__sub truncate" id="name"></div>
    </div>

    <div class="dialog__body">
      <div>
        <label class="prompt__label" id="label" for="value"></label>
        <input class="field prompt__input" id="value" type="text" />
        <span id="presets"></span>
      </div>
      <div>
        <label class="prompt__label" id="confirm-label" for="confirm">Confirm password</label>
        <input class="field prompt__input" id="confirm" type="text" />
      </div>
      <p class="banner banner--warn">
        <span>
          Keep this password somewhere safe. Zapit does not store it, and a protected PDF cannot be
          opened without it.
        </span>
      </p>
      <p class="error" id="error"></p>
    </div>

    <div class="dialog__foot">
      <span class="spacer"></span>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn btn--primary" id="go" type="button">Protect</button>
    </div>

    <script type="module" src="/src/windows/prompt/main.ts"></script>
  </body>
</html>
