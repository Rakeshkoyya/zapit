<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extract frame — Zapit</title>
    <meta name="prompt-option" content="at" />
    <meta name="prompt-label" content="Time in seconds" />
    <meta name="prompt-placeholder" content="10" />
    <meta name="prompt-presets" content="1,5,10,30,60" />
  </head>
  <body class="dialog">
    <div class="dialog__head">
      <div class="dialog__title">Extract frame</div>
      <div class="dialog__sub truncate" id="name"></div>
    </div>

    <div class="dialog__body">
      <div>
        <label class="prompt__label" id="label" for="value"></label>
        <input class="field prompt__input" id="value" type="text" inputmode="decimal" />
        <span id="presets"></span>
      </div>
      <p class="error" id="error"></p>
    </div>

    <div class="dialog__foot">
      <span class="spacer"></span>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn btn--primary" id="go" type="button">Extract</button>
    </div>

    <script type="module" src="/src/windows/prompt/main.ts"></script>
  </body>
</html>
