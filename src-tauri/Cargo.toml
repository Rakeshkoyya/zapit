[package]
name = "zapit"
version = "0.1.1"
description = "Right-click any file on Windows and instantly do the obvious thing with it. Offline, private, open source."
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zapit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The Trim window streams media over our own `zapitmedia://` scheme rather than
# Tauri's asset protocol, which hardcodes an unusable Content-Type for M4A
# (ADR 005) — so no `protocol-asset` feature is needed.
tauri = { version = "2", features = [] }
http = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-cli = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = { version = "0.4", features = ["std"] }
pdfium-render = "0.9.3"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.10.9"
md-5 = "0.10.6"
kamadak-exif = "0.6.1"
winreg = "0.56.0"
tauri-plugin-opener = "2.5.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
