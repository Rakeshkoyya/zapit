<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metadata — Zapit</title>
    <style>
      #wrap {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      td {
        padding: 6px 10px;
        vertical-align: top;
        border-bottom: 1px solid var(--border);
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td:first-child {
        width: 42%;
        color: var(--text-muted);
      }
      /* `sensitive` is set by metadata/main.ts for GPS and other locating tags. */
      tr.sensitive td {
        background: var(--danger-soft);
        color: var(--danger);
        font-weight: 600;
      }
      #empty {
        padding: 16px;
        text-align: center;
        color: var(--text-faint);
        font-size: 12.5px;
      }
      #empty[hidden] {
        display: none;
      }
    </style>
  </head>
  <body class="dialog">
    <div class="dialog__head">
      <div class="dialog__title truncate" id="name"></div>
      <div class="dialog__sub">Hidden information stored inside this file</div>
    </div>

    <div class="dialog__body">
      <p class="banner">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v5M12 8h.01" />
        </svg>
        <span>
          Anything highlighted in red can reveal where the photo was taken. Removing metadata saves
          a clean copy — your original is untouched.
        </span>
      </p>
      <div id="wrap">
        <p id="empty" hidden>No metadata found in this file.</p>
        <table>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="dialog__foot">
      <span class="spacer"></span>
      <button class="btn" id="close" type="button">Close</button>
      <button class="btn btn--primary" id="strip" type="button">Remove all metadata</button>
    </div>

    <script type="module" src="/src/windows/metadata/main.ts"></script>
  </body>
</html>
