<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compress video — Zapit</title>
    <meta name="prompt-option" content="targetMb" />
    <meta name="prompt-label" content="Target size in MB" />
    <meta name="prompt-placeholder" content="25" />
    <meta name="prompt-presets" content="8,15,25,50,100,200" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
      }
      body {
        margin: 0;
        padding: 14px 18px;
        user-select: none;
      }
      #name {
        margin: 0 0 10px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #label {
        display: block;
        margin-bottom: 6px;
      }
      input {
        font: inherit;
        width: 110px;
        padding: 3px 6px;
      }
      #presets {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-left: 10px;
      }
      #presets button,
      #buttons button {
        font: inherit;
        padding: 3px 12px;
      }
      .hint {
        font-size: 12px;
        opacity: 0.7;
        margin: 10px 0 0;
      }
      #buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <p id="name"></p>
    <label id="label" for="value"></label>
    <input id="value" type="text" inputmode="decimal" />
    <span id="presets"></span>
    <p class="hint">
      The video keeps its original resolution. To change resolution use
      <strong>Downscale to</strong>.
    </p>
    <div id="buttons">
      <button id="cancel" type="button">Cancel</button>
      <button id="go" type="button">Compress</button>
    </div>
    <script type="module" src="/src/windows/prompt/main.ts"></script>
  </body>
</html>
