<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protect PDF — Zapit</title>
    <meta name="prompt-option" content="password" />
    <meta name="prompt-label" content="New password" />
    <meta name="prompt-placeholder" content="" />
    <meta name="prompt-presets" content="" />
    <meta name="prompt-type" content="password" />
    <meta name="prompt-confirm" content="true" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
      }
      body {
        margin: 0;
        padding: 14px 18px;
        user-select: none;
      }
      #name {
        margin: 0 0 10px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #label,
      #confirm-label {
        display: block;
        margin-bottom: 6px;
      }
      #confirm-label {
        margin-top: 10px;
      }
      input {
        font: inherit;
        width: 200px;
        padding: 3px 6px;
      }
      #error {
        color: #e5484d;
        font-size: 12px;
        min-height: 16px;
        margin-top: 8px;
      }
      #buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      #buttons button {
        font: inherit;
        padding: 3px 12px;
      }
    </style>
  </head>
  <body>
    <p id="name"></p>
    <label id="label" for="value"></label>
    <input id="value" type="text" />
    <label id="confirm-label" for="confirm">Confirm password</label>
    <input id="confirm" type="text" />
    <span id="presets"></span>
    <div id="error"></div>
    <div id="buttons">
      <button id="cancel" type="button">Cancel</button>
      <button id="go" type="button">Protect</button>
    </div>
    <script type="module" src="/src/windows/prompt/main.ts"></script>
  </body>
</html>
