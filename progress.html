<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zapit</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px 20px;
        user-select: none;
      }
      #label {
        font-size: 13px;
        margin: 0 0 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      progress {
        width: 100%;
        height: 14px;
      }
      #row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
      }
      #percent {
        font-size: 12px;
        opacity: 0.8;
        flex: 1;
      }
      button {
        font: inherit;
        padding: 4px 14px;
      }
    </style>
  </head>
  <body>
    <p id="label">Working…</p>
    <progress id="bar" max="100"></progress>
    <div id="row">
      <span id="percent"></span>
      <button id="cancel" type="button">Cancel</button>
    </div>
    <script type="module" src="/src/windows/progress/main.ts"></script>
  </body>
</html>
