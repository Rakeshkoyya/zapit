<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checksum — Zapit</title>
    <style>
      #hash {
        display: block;
        font-family: var(--font-mono);
        font-size: 11.5px;
        line-height: 1.55;
        word-break: break-all;
        user-select: all;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-subtle);
      }
      #compare {
        flex: 1;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: 11.5px;
      }
      /* Set by result/main.ts as the whole className — no other classes here. */
      #verdict {
        min-height: 17px;
        font-size: 12px;
        font-weight: 600;
      }
      #verdict.ok {
        color: var(--success);
      }
      #verdict.bad {
        color: var(--danger);
      }
    </style>
  </head>
  <body class="dialog">
    <div class="dialog__head">
      <div class="dialog__title truncate" id="name"></div>
      <div class="dialog__sub"><span id="algorithm"></span> fingerprint</div>
    </div>

    <div class="dialog__body">
      <code id="hash"></code>
      <div class="stack">
        <span class="eyebrow">Check it against one you were given</span>
        <div class="row">
          <input class="field" id="compare" type="text" placeholder="Paste a hash to compare…" />
        </div>
      </div>
      <div id="verdict"></div>
    </div>

    <div class="dialog__foot">
      <span class="spacer"></span>
      <button class="btn" id="copy" type="button">Copy</button>
      <button class="btn btn--primary" id="close" type="button">Close</button>
    </div>

    <script type="module" src="/src/windows/result/main.ts"></script>
  </body>
</html>
