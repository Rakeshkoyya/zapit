<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resize — Zapit</title>
    <meta name="prompt-option" content="spec" />
    <meta name="prompt-label" content="New size (50% · 800x600 · 800w · 3.5x4.5cm@200dpi)" />
    <meta name="prompt-placeholder" content="800x600" />
    <meta name="prompt-presets" content="50%,25%,1920w,800x600,3.5x4.5cm@200dpi" />
  </head>
  <body class="dialog">
    <div class="dialog__head">
      <div class="dialog__title">Resize image</div>
      <div class="dialog__sub truncate" id="name"></div>
    </div>

    <div class="dialog__body">
      <div>
        <label class="prompt__label" id="label" for="value"></label>
        <input class="field prompt__input" id="value" type="text" />
        <span id="presets"></span>
      </div>
      <p class="error" id="error"></p>
    </div>

    <div class="dialog__foot">
      <span class="spacer"></span>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn btn--primary" id="go" type="button">Resize</button>
    </div>

    <script type="module" src="/src/windows/prompt/main.ts"></script>
  </body>
</html>
