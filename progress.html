<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zapit</title>
    <style>
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 16px 20px;
        user-select: none;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .spinner {
        width: 15px;
        height: 15px;
        flex: none;
        border: 2px solid var(--border-strong);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #label {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #percent {
        font-size: 12px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      /* A native <progress>, restyled — the script only sets `.value`. */
      progress {
        width: 100%;
        height: 6px;
        appearance: none;
        border: 0;
        border-radius: var(--radius-pill);
        background: var(--bg-subtle);
        overflow: hidden;
      }
      progress::-webkit-progress-bar {
        background: var(--bg-subtle);
        border-radius: var(--radius-pill);
      }
      progress::-webkit-progress-value {
        background: var(--accent);
        border-radius: var(--radius-pill);
        transition: width 200ms var(--ease);
      }

      #row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="spinner" aria-hidden="true"></span>
      <span id="label">Working…</span>
    </div>
    <progress id="bar" max="100"></progress>
    <div id="row">
      <span id="percent"></span>
      <span class="spacer"></span>
      <button class="btn" id="cancel" type="button">Cancel</button>
    </div>
    <script type="module" src="/src/windows/progress/main.ts"></script>
  </body>
</html>
