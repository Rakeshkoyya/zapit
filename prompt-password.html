<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unlock PDF — Zapit</title>
    <meta name="prompt-option" content="password" />
    <meta name="prompt-label" content="Current password" />
    <meta name="prompt-placeholder" content="" />
    <meta name="prompt-presets" content="" />
    <meta name="prompt-type" content="password" />
  </head>
  <body class="dialog">
    <div class="dialog__head">
      <div class="dialog__title">Unlock PDF</div>
      <div class="dialog__sub truncate" id="name"></div>
    </div>

    <div class="dialog__body">
      <div>
        <label class="prompt__label" id="label" for="value"></label>
        <input class="field prompt__input" id="value" type="text" />
        <span id="presets"></span>
      </div>
      <p class="banner">
        <span>Saves an unlocked copy. The password stays on this PC and is never stored.</span>
      </p>
      <p class="error" id="error"></p>
    </div>

    <div class="dialog__foot">
      <span class="spacer"></span>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn btn--primary" id="go" type="button">Unlock</button>
    </div>

    <script type="module" src="/src/windows/prompt/main.ts"></script>
  </body>
</html>
